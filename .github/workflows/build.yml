name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sonora-linux-amd64
            binary: sonora
          - os: macos-latest
            artifact: sonora-macos-arm64
            binary: sonora
          - os: windows-latest
            artifact: sonora-windows-amd64
            binary: sonora.exe
            ldflags: -H windowsgui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev \
            libxcursor-dev libvulkan-dev libasound2-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags "-s -w ${{ matrix.ldflags }} -X github.com/mehran9675/sonora/ui/pages/settings.Version=${version}" \
            -o dist/${{ matrix.binary }} ./cmd/sonora

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
